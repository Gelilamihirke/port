<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio</title>
    <link rel="stylesheet" type="text/css" href="../style/style.css">
    <link rel="icon" href="/Assets/favicons/favicon.png" type="image/png" sizes="32x32">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <style>
        /* Force the container to be a strict 3-column uniform Grid */
        #portfolio-container {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 30px !important;
        }

        /* Responsive handling for smaller screens */
        @media (max-width: 992px) {
            #portfolio-container {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }
        @media (max-width: 600px) {
            #portfolio-container {
                grid-template-columns: 1fr !important;
            }
        }

        /* Card flex styling to keep uniform height and push buttons to the bottom */
        .portfolio {
            display: flex !important;
            flex-direction: column !important;
            height: 100% !important;
            margin: 0 !important;
            width: 100% !important;
        }
        .portfolio .text {
            display: flex !important;
            flex-direction: column !important;
            flex-grow: 1 !important;
        }

        /* Custom Button Styling: Transparent BG, Red Hover, Padding, NO border line */
        .portfolio button, #open-modal-btn {
            background: transparent !important;
            border: none !important;
            color: #ffffff !important;
            padding: 10px 20px !important;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .portfolio button:hover, #open-modal-btn:hover {
            background: #e50914 !important;
            color: #ffffff !important;
        }
    </style>
</head>

<body>

    <header class="header" id="header">
        <a href="../../index.html" class="logo"><span class="main-icon"></span><span>Gelila</span></a>

        <div class="navbar">
            <a href="../../index.html">Home</a>
            <a href="./skills.html">skills</a>
            <a href="./education.html">Education</a>
            <a href="./career.html">Career</a>
            <a href="./portfolio.html" class="active">Portfolio</a>
        </div>

        <div class="main">
            <a href="contact.html" class="user main-items"><i class="fas fa-envelope cm-icon"></i>Contact Me</a>
            <div class="main-items menu-icon-container" id="menu-icon-js">
                <div class="bx bx-menu" id="menu-icon"></div>
            </div>
        </div>
    </header>

    <div class="page">
        <main class="portfolio-main">
            <div class="portfolio-section">
                <div class="portfolio-header">
                    <div class="header-text">Portfolio</div>
                    <div class="header-line"></div>
                </div>

                <!-- Dynamic Grid Container -->
                <div class="section" id="portfolio-container">
                    <!-- Projects are populated dynamically via JavaScript -->
                </div>

                <!-- Admin-Only Add Project Button Control -->
                <div id="admin-controls" style="display: none; text-align: center; margin: 40px 0;">
                    <button type="button" id="open-modal-btn">
                        <i class="fa-solid fa-plus"></i> Add New Project
                    </button>
                </div>

            </div>
        </main>

        <footer class="footer">
            <div class="left">
                <p>&copy; 2026 • Gelila Mihirke • All Rights Reserved</p>
            </div>
            <div class="right">
                <div class="social"><a href="https://www.facebook.com/lala.mihirke" target="_blank"><i class="fa-brands fa-facebook"></i></a></div>
                <div class="social"><a href="https://www.linkedin.com/in/gelila-mihirke-ab67bb3a8" target="_blank"><i class="fa-brands fa-linkedin"></i></a></div>
                <div class="social"><a href="https://github.com/Gelilamihirke" target="_blank"><i class="fa-brands fa-github"></i></a></div>
            </div>
        </footer>
    </div>

    <!-- Modal Popup Form for Local Storage Additions -->
    <div id="project-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #181818; padding: 30px; border-radius: 8px; width: 90%; max-width: 500px; color: white; box-shadow: 0 8px 25px rgba(0,0,0,0.6); border: 1px solid #333;">
            <h3 style="margin-bottom: 20px; font-size: 20px; border-bottom: 2px solid #e50914; padding-bottom: 8px;">Add New Portfolio Project</h3>
            <form id="add-project-form">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500;">Project Title</label>
                    <input type="text" id="proj-title" required style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; font-size: 14px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500;">Overview / Description</label>
                    <textarea id="proj-desc" rows="4" required style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; font-size: 14px; resize: vertical;"></textarea>
                </div>
                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500;">Project Link (Live Preview / GitHub)</label>
                    <input type="url" id="proj-link" required placeholder="https://" style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; font-size: 14px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="button" id="close-modal-btn" style="background: transparent !important; border: none !important; padding: 10px 20px !important;">Cancel</button>
                    <button type="submit" style="background: #e50914 !important; border: none !important; padding: 10px 20px !important;">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <div class="nav-touch-close" id="nav-tc-js"></div>
    <script type="text/javascript" src="../script/script.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isAdmin = urlParams.get("admin") === "true";

            if (isAdmin) {
                const adminControls = document.getElementById("admin-controls");
                if (adminControls) adminControls.style.display = "block";
            }

            const modal = document.getElementById("project-modal");
            const openBtn = document.getElementById("open-modal-btn");
            const closeBtn = document.getElementById("close-modal-btn");
            const form = document.getElementById("add-project-form");

            if (openBtn) openBtn.addEventListener("click", () => modal.style.display = "flex");
            if (closeBtn) closeBtn.addEventListener("click", () => modal.style.display = "none");
            window.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });

            loadSavedProjects(isAdmin);

            if (form) {
                form.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const title = document.getElementById("proj-title").value;
                    const desc = document.getElementById("proj-desc").value;
                    const link = document.getElementById("proj-link").value;

                    const newProject = { title, desc, link };
                    let projects = JSON.parse(localStorage.getItem("myProjects")) || [];
                    projects.push(newProject);
                    localStorage.setItem("myProjects", JSON.stringify(projects));

                    location.reload(); // Reload to cleanly re-index all cards
                });
            }
        });

        function loadSavedProjects(isAdmin) {
            // Default project list containing all your current items
            const defaultProjects = [
                {
                    title: "English-Amharic Neural Machine Translation",
                    desc: "Fine-tuned mT5 model for bidirectional English-Amharic translation trained on 30,000 sentence pairs, achieving robust BLEU-4 scores (28.7 En→Am, 31.2 Am→En)[cite: 2, 3].",
                    link: "https://huggingface.co/spaces/gelilamihirke/eng amh"
                },
                {
                    title: "Netflix Clone",
                    desc: "Designed and implemented a responsive Netflix clone with React and Node.js. Utilized RESTful APIs for movie data fetching and authentication features.",
                    link: "https://gelilamihirke.github.io/e-movie/"
                },
                {
                    title: "Hotel Booking App",
                    desc: "Designed and implemented a hotel booking app with Flutter and Firebase with features like favorites, language, dark mode, map and search.",
                    link: "https://drive.google.com/drive/folders/16z_WsBxZU-e8kivcefc5UpS160pVs5lv"
                },
                {
                    title: "Real-Time Chat App",
                    desc: "Designed and implemented a chat app with React, Express.js, and MongoDB with features like real-time chat, filter out, and theme changing.",
                    link: "https://github.com/Fenet-damena/Chat-App"
                },
                {
                    title: "Trade Center Monorepo",
                    desc: "A scalable full-stack monorepo architecture designed for trade and marketplace operations, integrating robust backend services with a responsive frontend interface.",
                    link: "https://github.com/Gelilamihirke/trade-center_monorepo"
                },
                {
                    title: "Amharic OCR System",
                    desc: "Built an end-to-end OCR and handwritten text recognition pipeline tailored for Ethiopic scripts using deep learning architectures like CNNs and Sequence-to-Sequence models.",
                    link: "https://github.com/GCProject2026/Amharic-OCR"
                }
            ];

            let projects = JSON.parse(localStorage.getItem("myProjects"));
            
            // If localStorage is empty, initialize it with default projects
            if (!projects) {
                projects = defaultProjects;
                localStorage.setItem("myProjects", JSON.stringify(projects));
            }

            const container = document.getElementById("portfolio-container");
            if (!container) return;
            container.innerHTML = ""; // Clear container before rendering

            projects.forEach((proj, index) => {
                appendProjectCard(proj, index, isAdmin);
            });
        }

        function appendProjectCard(proj, index, isAdmin) {
            const container = document.getElementById("portfolio-container");
            if (!container) return;

            const cardDiv = document.createElement("div");
            cardDiv.className = "portfolio";
            
            let deleteBtnHTML = isAdmin ? `
                <button type="button" onclick="deleteProject(${index})" style="background: transparent; border: none; color: #ff4d4d; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    <i class="fa-solid fa-trash"></i> Delete
                </button>
            ` : '';

            cardDiv.innerHTML = `
                <div class="header">
                    <div class="header-text">${proj.title}</div>
                    <div class="header-line"></div>
                </div>
                <div class="text">
                    ${proj.desc}
                    <div style="display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: auto; padding-top: 20px; flex-wrap: wrap; width: 100%;">
                        <a href="${proj.link}" target="_blank">
                            <button type="button">
                                View Project
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </button>
                        </a>
                        ${deleteBtnHTML}
                    </div>
                </div>
            `;
            container.appendChild(cardDiv);
        }

        function deleteProject(index) {
            if (confirm("Are you sure you want to delete this project?")) {
                let projects = JSON.parse(localStorage.getItem("myProjects")) || [];
                projects.splice(index, 1);
                localStorage.setItem("myProjects", JSON.stringify(projects));
                location.reload();
            }
        }
    </script>
</body>

</html>
